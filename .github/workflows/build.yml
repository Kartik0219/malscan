name: build-binaries

# Build standalone malscan binaries for Windows + macOS and attach them to a
# GitHub Release. Triggers on a version tag (e.g. v0.1.0) or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
            out: malscan.exe
            artifact: malscan-windows-x64.exe
          - os: macos-14          # Apple Silicon (arm64)
            sep: ":"
            out: malscan
            artifact: malscan-macos-arm64
          # Intel macOS (macos-13) intentionally omitted for now: the free-tier
          # Intel runner queue is unreliable. arm64 covers Macs from late 2020+.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask waitress pefile yara-python pyinstaller

      - name: Build standalone binary
        run: >
          pyinstaller --noconfirm --onefile --console --name malscan
          --add-data "signatures${{ matrix.sep }}signatures"
          --add-data "malscan/web/templates${{ matrix.sep }}malscan/web/templates"
          --hidden-import waitress --hidden-import pefile --hidden-import yara
          --exclude-module anthropic
          run_malscan.py

      - name: Rename artifact
        shell: bash
        run: mv "dist/${{ matrix.out }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
